<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c14"/>
      <stop offset="100%" stop-color="#05060a"/>
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowRed" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background tile -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bgGrad)" stroke="#00f3ff" stroke-width="3" stroke-opacity="0.8"/>

  <!-- Circuit traces -->
  <g stroke="#00f3ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" fill="none">
    <path d="M 12 36 L 28 36 L 36 44"/>
    <circle cx="12" cy="36" r="2.5" fill="#00f3ff"/>
    <path d="M 116 36 L 100 36 L 92 44"/>
    <circle cx="116" cy="36" r="2.5" fill="#00f3ff"/>
    <path d="M 12 92 L 28 92 L 38 82"/>
    <circle cx="12" cy="92" r="2.5" fill="#00f3ff"/>
    <path d="M 116 92 L 100 92 L 90 82"/>
    <circle cx="116" cy="92" r="2.5" fill="#00f3ff"/>
    <path d="M 64 8 L 64 20"/>
  </g>

  <!-- Stylized Cyber Skull -->
  <!-- Cranium -->
  <path d="M 64 22 C 42 22, 34 36, 34 52 C 34 66, 42 74, 46 78 L 48 88 L 80 88 L 82 78 C 86 74, 94 66, 94 52 C 94 36, 86 22, 64 22 Z"
        fill="#0d111a" stroke="#00f3ff" stroke-width="2.5" filter="url(#glowCyan)"/>

  <!-- Forehead circuit lines -->
  <path d="M 54 28 L 54 40 L 60 46" stroke="#00f3ff" stroke-width="1.5" fill="none" opacity="0.8"/>
  <path d="M 74 28 L 74 38 L 70 42" stroke="#ff0055" stroke-width="1.5" fill="none" opacity="0.8"/>

  <!-- Left Eye (Cyan cyber eye) -->
  <path d="M 44 54 Q 50 50, 56 55 Q 52 64, 44 60 Z" fill="#05060a" stroke="#00f3ff" stroke-width="1.5"/>
  <circle cx="50" cy="56" r="2.5" fill="#00f3ff" filter="url(#glowCyan)"/>

  <!-- Right Eye (Red optic implant) -->
  <path d="M 72 55 Q 78 50, 84 54 Q 84 60, 76 64 Z" fill="#18040a" stroke="#ff0055" stroke-width="2"/>
  <circle cx="78" cy="57" r="4.5" fill="#ff0055" filter="url(#glowRed)"/>
  <circle cx="78" cy="57" r="2" fill="#ffffff"/>
  <circle cx="78" cy="57" r="7" stroke="#ff0055" stroke-width="1" stroke-dasharray="2,2" fill="none" opacity="0.7"/>

  <!-- Nasal cavity -->
  <polygon points="64,63 61,72 67,72" fill="#00f3ff" opacity="0.9"/>

  <!-- Teeth / Jaw plate -->
  <g stroke="#00f3ff" stroke-width="1.5" fill="none">
    <line x1="52" y1="88" x2="52" y2="98"/>
    <line x1="60" y1="88" x2="60" y2="100"/>
    <line x1="68" y1="88" x2="68" y2="100"/>
    <line x1="76" y1="88" x2="76" y2="98"/>
    <path d="M 48 94 L 80 94"/>
    <path d="M 50 102 C 54 105, 74 105, 78 102" stroke-width="2"/>
  </g>
</svg>
